services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: wordpress
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:php8.1-apache
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DEBUG: 1
    volumes:
      - wp_data:/var/www/html
      - .:/var/www/html/wp-content/plugins/consentimental

  wpcli:
    image: wordpress:cli-php8.1
    # Matches the `wordpress` service's www-data UID (33, Debian-based image) rather
    # than this image's own default (82, Alpine-based) — otherwise `wp plugin install`
    # and similar file-writing commands fail silently against the shared wp_data
    # volume, which the Apache container's www-data (33) owns.
    user: "33:33"
    depends_on:
      - db
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - wp_data:/var/www/html
      - .:/var/www/html/wp-content/plugins/consentimental
    entrypoint: ["tail", "-f", "/dev/null"]

volumes:
  db_data:
  wp_data:
